[project]
name = "zify-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "langgraph>=0.2",
  "langchain-openai>=0.2",
  "langgraph-checkpoint-postgres>=2.0",
  "psycopg[binary,pool]>=3.2",
  "prisma>=0.15",
  "python-dotenv>=1.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "langgraph-cli[inmem]>=0.4.30",
]
